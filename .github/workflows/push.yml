      - name: Run integration tests
        run: |
          echo "TODO: Add integration tests"
          # pytest tests/integration/
          # npm run test:integration

  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # TODO: Install dependencies and browser drivers
      # - name: Install Playwright
      #   run: npx playwright install --with-deps

      - name: Run E2E tests
        run: |
          echo "TODO: Add E2E tests"
          # npx playwright test
          # pytest tests/e2e/

  # ===========================================================================
  # SECURITY: Additional security scanning (beyond pre-commit)
  # ===========================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run gitleaks (full history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: false
        with:
          extra_args: --baseline-path=.gitleaks-baseline.json
        continue-on-error: true

      # TODO: Add CodeQL for supported languages
      # - name: Initialize CodeQL
      #   uses: github/codeql-action/init@v3
      #   with:
      #     languages: python, javascript
      #
      # - name: Perform CodeQL Analysis
      #   uses: github/codeql-action/analyze@v3

  # ===========================================================================
