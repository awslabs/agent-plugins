name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ===========================================================================
  # BUILD: Linting, formatting, security scanning via pre-commit
  # ===========================================================================
  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pre-commit
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit (linting + security)
        run: |
          # Skip hooks not applicable in CI:
          # - no-commit-to-branch: CI can commit to any branch
          # - gitleaks: uses Go proxy which has network issues in act;
          #             gitleaks-action in security job does full history scan instead
          SKIP=no-commit-to-branch,gitleaks pre-commit run --all-files

  # ===========================================================================
  # TEST: Unit, Integration, E2E tests
  # ===========================================================================
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # TODO: Install dependencies
      # - name: Install dependencies
      #   run: |
      #     pip install -e ".[test]"
      #     # or: npm ci
      #     # or: uv sync --frozen

      - name: Run unit tests
        run: |
          echo "TODO: Add unit tests"
          # pytest tests/unit/ --cov --cov-report=xml
          # npm run test:unit
          # uv run pytest tests/unit/

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # TODO: Install dependencies and set up services
