# exclusions.toml — human-maintained source of truth for Semgrep rule decisions.
#
# Each [rules."<rule-id>"] entry records a decision about one rule from the
# Semgrep r/all ruleset:
#   status = "excluded"  -> the rule is physically removed from r-all.active.yaml
#   status = "active"    -> the rule is kept (explicitly decided, documented here)
#   pr                   -> the PR number where the decision was made ("TBD" if unknown)
#   reason               -> why the decision was made
#
# Rules with no entry here are implicitly active. Edit this file, then run
# `mise run semgrep:update` to regenerate r-all.active.yaml and EXCLUSIONS.md.
#
# Seeded from the 22 --exclude-rule flags previously duplicated across
# mise.toml, the CI workflow, and documented in the old .semgrep.yaml stub.

# --- AI / generic provider references (expected in this repository) -----------

[rules."ai.generic.detect-generic-ai-anthprop.detect-generic-ai-anthprop"]
status = "excluded"
pr = "220"
reason = "This is a Claude Code plugin repository — Anthropic references are expected."

[rules."ai.generic.detect-generic-ai-oai.detect-generic-ai-oai"]
status = "excluded"
pr = "89"
reason = "OpenAI references appear in documentation/examples, not as secrets."

# --- Secrets false positives --------------------------------------------------

[rules."generic.secrets.security.detected-sonarqube-docs-api-key.detected-sonarqube-docs-api-key"]
status = "excluded"
pr = "220"
reason = "False positive — dynamically generated tokens in CI, not hardcoded secrets."

